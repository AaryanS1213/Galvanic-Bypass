[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galvanic-bypass"
version = "0.1.0"
description = "Per-cell bypass thermal management for REON battery strings (MIT Energy & Climate Hack 2026)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "pydantic>=2",
    "streamlit",
    "plotly",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["gb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
